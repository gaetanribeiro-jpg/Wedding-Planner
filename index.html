<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>L'Atelier du Jour J</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================== la charte
   REGISTRE PARCHEMIN. On quitte l'ardoise sombre : le chassis, les panneaux
   et les menus sont en beige, l'encre est brune, et le bois encadre le tout.
   La regle de forme ne bouge pas : zero degrade, zero ombre floue.

   Le relief est fait de DEUX ARETES NETTES — une claire en haut a gauche,
   une sombre en bas a droite. C'est le biseau des jeux de gestion pixel, il
   ne coute aucun degrade, et c'est lui qui rend un bouton lisible comme
   bouton sans avoir a l'ecrire.

   ⚠️ LES COULEURS DE config.js ONT DEUX METIERS. `STYLE[x].couleur` teinte un
   sprite sur le canvas ET sert d'encre dans le DOM. Elles sont claires parce
   que le canvas est sombre ; sur parchemin elles deviennent illisibles (2,2:1
   pour le romantique). C'est `encre()` dans ui.js qui les assombrit au moment
   de l'affichage, jusqu'a 4,5:1 — la teinte du canvas, elle, ne bouge pas.
   Ne « corrige » pas config.js : tu casserais les sprites.  */
:root{
  /* le parchemin, du plus clair au plus fonce */
  --p0:#fdf7ea; --p1:#f6ead4; --p2:#ecdab7; --p3:#dec89c; --p4:#c9ac78;
  /* le bois du cadre */
  --bois:#8a5a2e; --bois2:#63401f; --bois3:#a97442;
  /* l'encre */
  --encre:#3f2d1c; --encre2:#6b5236; --faible:#87704f;
  /* les metiers — un seul par couleur, et tous lisibles SUR PARCHEMIN */
  --or:#9c6d09; --or-vif:#e2ae3e; --or-clair:#f6d894;
  --poudre:#b94a6f; --prune:#8a2c4f; --vert:#4a7540;
  /* le bleu est le metier de la NAVIGATION : onglets et menus, jamais une
     donnee de jeu. C'est ce qui permet de le lire sans le decoder. */
  --bleu:#3f6fa8; --bleu-clair:#6098da; --bleu-fonce:#2a4d78;
  --texte:var(--encre);
  --pixel:'Silkscreen',monospace; --mono:'JetBrains Mono',ui-monospace,monospace;
  --relief:inset 2px 2px 0 var(--p0), inset -2px -2px 0 var(--p4);
}
*{box-sizing:border-box}
body{margin:0;background:#6d4522;color:var(--texte);
     font:14px/1.65 var(--mono);padding:18px 12px 48px;
     display:flex;justify-content:center}
#app{width:100%;max-width:1000px}
button,textarea{font:inherit;color:inherit}

/* ---- boutons : gros, biseautes, lisibles d'un coup d'oeil ---- */
button{background:var(--p2);border:2px solid var(--bois);
       padding:9px 15px;cursor:pointer;font-weight:700;letter-spacing:.01em;
       box-shadow:var(--relief)}
button:hover:not(:disabled){background:var(--p1)}
/* Le bouton s'enfonce : l'arete claire passe en bas. Un retour physique vaut
   mieux qu'un changement de teinte, surtout sur un ecran tactile. */
button:active:not(:disabled){box-shadow:inset -2px -2px 0 var(--p0),
                                        inset 2px 2px 0 var(--p4)}
button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
button.or{background:var(--or-vif);border-color:#7d5606;color:#33240a;
  box-shadow:inset 2px 2px 0 var(--or-clair), inset -2px -2px 0 #9c6d09}
button.or:hover:not(:disabled){background:#eebf5c}
button.danger{background:var(--prune);border-color:#521a2f;color:#fceef3;
  box-shadow:inset 2px 2px 0 #b04a72, inset -2px -2px 0 #521a2f}
button.danger:hover:not(:disabled){background:#a33a60}
/* Un bouton qui ne porte qu'un signe n'a pas besoin de la largeur d'un bouton
   qui porte une phrase : sans cette regle, la croix de renvoi occupait autant
   de place que la fiche du membre et passait a la ligne toute seule. */
button.mini{padding:4px 9px;line-height:1;font-size:13px}
button.discret{background:transparent;border-color:transparent;
  box-shadow:none;color:var(--faible);font-weight:400;padding:6px 10px}
button.discret:hover:not(:disabled){color:var(--encre);background:var(--p2)}
button[data-on]{background:var(--bleu);border-color:var(--bleu-fonce);color:#fff;
  box-shadow:inset 2px 2px 0 var(--bleu-clair), inset -2px -2px 0 var(--bleu-fonce)}
textarea{background:var(--p0);border:2px solid var(--bois);width:100%;
         padding:9px;resize:vertical;word-break:break-all;
         box-shadow:inset 2px 2px 0 var(--p3)}

/* ---- chassis de jeu : un cadre de bois autour du parchemin ---- */
.jeu{border:4px solid var(--bois);background:var(--p1);
     box-shadow:0 0 0 3px var(--bois2)}
.barre{display:flex;align-items:center;gap:10px;row-gap:6px;padding:9px 12px;
       background:var(--p2);border-bottom:3px solid var(--bois);
       font-size:12px;flex-wrap:wrap;
       box-shadow:inset 0 2px 0 var(--p0)}
@media(max-width:1000px){.barre .res .lbl{display:none}}
.barre .titre{font-family:var(--pixel);font-size:13px;color:var(--encre);
       letter-spacing:.05em}
.barre .palier{font-family:var(--pixel);font-size:10px;color:#33240a;
       background:var(--or-vif);border:2px solid #7d5606;padding:3px 8px;
       letter-spacing:.05em;
       box-shadow:inset 1px 1px 0 var(--or-clair)}
.res{display:flex;align-items:center;gap:6px}
.res i{width:9px;height:9px;display:block;border:1px solid rgba(0,0,0,.28)}
.res .lbl{color:var(--faible)}
.res b{font-variant-numeric:tabular-nums;color:var(--encre);font-size:13px}
.vitesse{margin-left:auto;display:flex;gap:3px}
.vitesse span{border:2px solid var(--bois);padding:4px 9px;font-size:11px;
       font-weight:700;color:var(--encre2);background:var(--p3);cursor:pointer;
       box-shadow:inset 1px 1px 0 var(--p1)}
.vitesse span:hover{background:var(--p2)}
.vitesse span[data-on]{background:var(--bleu);color:#fff;
       border-color:var(--bleu-fonce);
       box-shadow:inset 1px 1px 0 var(--bleu-clair)}
/* ⚠️ Pas de `width:100%` ici : l'echelle d'affichage doit rester un ENTIER
   (voir `cadrer()` dans main.js), sinon les pixels sortent de tailles
   inegales. Le JS pose la largeur ; ce bloc ne fait que le cadre. */
.scene{display:block;image-rendering:pixelated;max-width:100%;height:auto;
       background:var(--p3);margin:0 auto}

/* ---- les onglets : la navigation principale, donc la plus grosse cible ----
   Gros pave bleu, texte blanc, arete nette. L'onglet actif passe en or ET
   s'enfonce : deux signaux plutot qu'un, parce qu'une simple difference de
   teinte se perd des qu'on regarde ailleurs. */
.onglets{display:flex;gap:4px;padding:6px;background:var(--bois);
         border-top:3px solid var(--bois2);flex-wrap:wrap}
.onglets span{flex:1 1 96px;text-align:center;padding:12px 6px;
  font-family:var(--pixel);font-size:12px;letter-spacing:.04em;
  color:#fff;background:var(--bleu);cursor:pointer;user-select:none;
  box-shadow:inset 2px 2px 0 var(--bleu-clair), inset -2px -2px 0 var(--bleu-fonce);
  text-shadow:1px 1px 0 rgba(0,0,0,.4)}
.onglets span:hover{background:#4a80bd}
.onglets span[data-on]{background:var(--or-vif);color:#33240a;
  box-shadow:inset -2px -2px 0 var(--or-clair), inset 2px 2px 0 #9c6d09;
  text-shadow:1px 1px 0 rgba(255,255,255,.45)}

/* ---- panneaux ---- */
.panneau{background:var(--p1);border:3px solid var(--bois);padding:14px;
         border-top:0}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:0}
@media(max-width:820px){.deux{grid-template-columns:1fr}}
.ligne{display:flex;align-items:center;gap:9px;padding:7px 0;
       border-bottom:2px solid var(--p3);font-size:13px;flex-wrap:wrap}
.ligne:last-child{border-bottom:0}
.ligne.mince{padding:4px 0;border-bottom:0}
.ligne b{color:var(--encre)}
.sous-titre{font-family:var(--pixel);font-size:11px;color:var(--bois);
       letter-spacing:.05em;margin:14px 0 4px;padding-bottom:3px;
       border-bottom:3px solid var(--p3)}
.etiq{font-family:var(--pixel);font-size:12px;color:var(--encre);
      background:var(--p3);border-left:6px solid var(--or-vif);
      letter-spacing:.05em;margin:0 0 12px;display:block;padding:6px 10px;
      box-shadow:inset 0 1px 0 var(--p1)}
.jauge{flex:1;min-width:64px;height:12px;background:var(--p0);
       border:2px solid var(--bois);box-shadow:inset 2px 2px 0 var(--p3)}
.jauge i{display:block;height:100%;box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.faible{color:var(--faible)}
.or{color:var(--or)} .vert{color:var(--vert)}
.prune{color:var(--prune)} .poudre{color:var(--poudre)}
.pill{border:2px solid currentColor;padding:2px 7px;font-size:11px;
      font-weight:700;white-space:nowrap;background:var(--p0)}
.pastille{display:inline-block;width:12px;height:12px;
      border:2px solid var(--bois);vertical-align:-2px}
.vign{display:inline-block;flex:none}

/* ---- blocs de dossier ---- */
.bloc{border:3px solid var(--bois);background:var(--p0);padding:10px;
      margin-bottom:10px;box-shadow:inset 0 2px 0 #fff}
.bloc.chaud{border-color:var(--prune);background:#fbf0f3}
.detail{border-top:3px solid var(--p3);margin-top:10px;padding-top:10px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
@media(max-width:560px){.slots{grid-template-columns:repeat(2,1fr)}}
.slot{border:2px solid var(--bois);padding:10px;font-size:12px;
      background:var(--p2);text-align:left;display:block;width:100%;
      cursor:pointer;box-shadow:var(--relief);font-weight:400}
.slot:hover{background:var(--p1)}
.slot u{display:block;text-decoration:none;color:var(--bois);font-size:10px;
        font-family:var(--pixel);letter-spacing:.04em;margin-bottom:5px}
.slot b{display:block;color:var(--encre);font-size:13px}
.slot[data-vide]{border-style:dashed;background:var(--p1);box-shadow:none}
.slot[data-vide] b{color:var(--faible)}
.slot[data-on]{background:var(--or-vif);border-color:#7d5606;
      box-shadow:inset -2px -2px 0 var(--or-clair), inset 2px 2px 0 #9c6d09}
.slot[data-on] u{color:#5c410a}
.choix{border:3px solid var(--or-vif);background:var(--p0);padding:10px;
       margin-top:10px;max-height:360px;overflow-y:auto}
.carte-art{display:flex;align-items:center;gap:9px;padding:7px 0;
           border-bottom:2px solid var(--p2)}
.carte-art .corps{flex:1;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.grille-cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));
            gap:8px;margin:8px 0}
.carte{display:flex;flex-direction:column;align-items:flex-start;gap:3px;
       text-align:left;padding:9px;font-size:11px;font-weight:400}

/* ---- bandeaux ---- */
.bandeau{background:var(--p2);border:2px solid var(--bois);
  border-left:8px solid var(--or-vif);padding:10px 14px;
  font-size:13px;color:var(--encre);display:flex;align-items:center;
  gap:12px;flex-wrap:wrap;box-shadow:inset 0 2px 0 var(--p0)}
.bandeau.urgent{border-left-color:var(--prune);background:#f6dfe6}
.bandeau.alerte{border-left-color:var(--prune);background:#f2d3dc}
.bandeau.guide{border-left-color:var(--bleu);background:#e4ecf7}

/* ---- resultat du jour J ---- */
.resultat{border-top:3px solid var(--bois)}
.score{font-family:var(--pixel);font-size:40px;color:var(--or);line-height:1;
       text-shadow:2px 2px 0 var(--p3)}
.score.prune{color:var(--prune)}

/* ---- le SEUL modal du jeu : le salon ---- */
.modal{position:fixed;inset:0;background:rgba(63,45,28,.86);z-index:50;
       display:flex;align-items:flex-start;justify-content:center;
       padding:24px 12px;overflow-y:auto}
/* ⚠️ `display:flex` ecrase l'attribut `hidden`, qui ne vaut que `display:none`
   par defaut. Sans cette regle, le modal invisible reste etale sur tout
   l'ecran et AVALE TOUS LES CLICS — le jeu se lance et ne repond a rien.
   Meme piege pour le flash. */
.modal[hidden],.flash[hidden]{display:none}
.modal .boite{width:100%;max-width:660px;border:4px solid var(--or-vif);
       background:var(--p1);box-shadow:0 0 0 4px var(--bois2)}
.modal .panneau{border:0}

/* ---- flash ---- */
.flash{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  background:var(--p1);border:3px solid var(--bois);color:var(--encre);
  padding:10px 18px;font-size:13px;font-weight:700;z-index:60;
  max-width:90vw;text-align:center;box-shadow:0 0 0 3px var(--bois2)}

/* ---- ecran titre ---- */
.titre-ecran{border:4px solid var(--bois);background:var(--p1);
  box-shadow:0 0 0 3px var(--bois2);padding:0 0 24px;text-align:center}
.titre-ecran canvas{display:block;width:100%;height:auto;image-rendering:pixelated;
  border-bottom:4px solid var(--bois)}
.titre-ecran h1{font-family:var(--pixel);font-size:30px;color:var(--encre);
  letter-spacing:.04em;margin:22px 0 8px;text-shadow:2px 2px 0 var(--p3)}
.titre-ecran .sous{color:var(--encre2);max-width:54ch;margin:0 auto 22px;
  padding:0 18px;font-size:13px}
.titre-ecran .menu{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
  padding:0 18px}
.titre-ecran .menu button{font-size:15px;padding:13px 22px}
.titre-ecran .pied{color:var(--faible);font-size:11px;margin:24px 18px 0}
.titre-ecran .alerte-txt{color:var(--prune);font-size:12px;margin:16px 18px 0;
  font-weight:700}
#titre-zone{max-width:540px;margin:16px auto 0;padding:0 18px;text-align:left}
</style>
</head>
<body>
<div id="app"></div>
<noscript>
  <p>Ce jeu est entièrement dessiné à l'exécution : il lui faut JavaScript.</p>
</noscript>
<!-- ⚠️ Les modules sont en ESM : ouvrir ce fichier en file:// ne marche pas.
     Il faut passer par un serveur — `npm run dev`. -->
<script type="module" src="src/main.js"></script>
</body>
</html>
