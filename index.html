<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>L'Atelier du Jour J</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================== la charte
   On quitte l'ardoise nuit + cyan de SAO pour un registre chaud, mais les
   REGLES DE FORME ne bougent pas : zero arrondi, zero degrade, zero ombre
   douce, bordures franches de 2 px. Un seul metier par couleur.

   La seule entorse assumee au « zero degrade » est le ciel du jour J et de
   l'ecran titre : un aplat uni derriere une scene de coucher de soleil
   supprime la profondeur. Elle est dans le canvas, pas ici. */
:root{
  --nuit:#2e2434; --nuit2:#3d3044; --bord:#584a63; --bord2:#6e5c78;
  --creme:#f7efe4; --creme2:#e8dcc9;
  --or:#d8a94a; --poudre:#e69aa6; --prune:#8c4f6b; --vert:#7fa87a;
  --texte:#f4ecdf; --faible:#a89bb0;
  --pixel:'Silkscreen',monospace; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:#221a29;color:var(--texte);
     font:13px/1.6 var(--mono);padding:18px 12px 48px;
     display:flex;justify-content:center}
#app{width:100%;max-width:980px}
button,textarea{font:inherit;color:inherit}
button{background:var(--nuit2);border:2px solid var(--bord);
       padding:5px 11px;cursor:pointer;letter-spacing:.02em}
button:hover:not(:disabled){border-color:var(--poudre);color:var(--poudre)}
button:disabled{opacity:.4;cursor:not-allowed}
button.or{border-color:var(--or);color:var(--or)}
button.or:hover:not(:disabled){background:var(--or);color:var(--nuit)}
button.danger{border-color:var(--prune);color:var(--poudre)}
button.discret{border-color:transparent;color:var(--faible)}
button[data-on]{border-color:var(--poudre);color:var(--poudre);background:var(--nuit)}
textarea{background:#221a29;border:2px solid var(--bord);width:100%;
         padding:8px;resize:vertical;word-break:break-all}

/* ---- chassis de jeu ---- */
.jeu{border:2px solid var(--bord2);background:var(--nuit);
     box-shadow:0 0 0 4px #1a1420}
.barre{display:flex;align-items:center;gap:12px;padding:7px 10px;
       background:var(--nuit2);border-bottom:2px solid var(--bord);
       font-size:11px;flex-wrap:wrap}
.barre .titre{font-family:var(--pixel);color:var(--creme);letter-spacing:.06em}
.barre .palier{font-family:var(--pixel);font-size:9px;color:var(--or);
       border:2px solid var(--or);padding:2px 6px;letter-spacing:.06em}
.res{display:flex;align-items:center;gap:5px}
.res i{width:8px;height:8px;display:block}
.res .lbl{color:var(--faible)}
.res b{font-variant-numeric:tabular-nums}
.vitesse{margin-left:auto;display:flex;gap:2px}
.vitesse span{border:2px solid var(--bord);padding:2px 7px;font-size:10px;
       color:var(--faible);cursor:pointer}
.vitesse span[data-on]{border-color:var(--poudre);color:var(--poudre)}
/* ⚠️ Pas de `width:100%` ici : l'echelle d'affichage doit rester un ENTIER
   (voir `cadrer()` dans main.js), sinon les pixels sortent de tailles
   inegales. Le JS pose la largeur ; ce bloc ne fait que le cadre. */
.scene{display:block;image-rendering:pixelated;max-width:100%;height:auto;
       background:var(--nuit);margin:0 auto}
.onglets{display:flex;background:var(--nuit2);border-top:2px solid var(--bord);
         flex-wrap:wrap}
.onglets span{flex:1 1 0;text-align:center;padding:8px 4px;
  font-family:var(--pixel);font-size:9px;letter-spacing:.06em;
  color:var(--faible);border-right:2px solid var(--bord);cursor:pointer}
.onglets span:last-child{border-right:0}
.onglets span[data-on]{color:var(--poudre);background:var(--nuit);
  box-shadow:inset 0 -3px 0 var(--poudre)}

/* ---- panneaux ---- */
.panneau{background:var(--nuit);border:2px solid var(--bord);padding:12px;
         border-top:0}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:0}
@media(max-width:820px){.deux{grid-template-columns:1fr}}
.ligne{display:flex;align-items:center;gap:8px;padding:6px 0;
       border-bottom:1px solid #453a4e;font-size:12px;flex-wrap:wrap}
.ligne:last-child{border-bottom:0}
.ligne.mince{padding:3px 0;border-bottom:0}
.ligne b{color:var(--creme)}
.sous-titre{font-family:var(--pixel);font-size:9px;color:var(--faible);
       letter-spacing:.06em;margin:10px 0 2px;border-bottom:2px solid var(--bord)}
.etiq{font-family:var(--pixel);font-size:10px;color:var(--or);
      letter-spacing:.08em;margin:2px 0 8px;display:block}
.jauge{flex:1;min-width:60px;height:9px;background:#221a29;border:1px solid var(--bord)}
.jauge i{display:block;height:100%}
.faible{color:var(--faible)}
.or{color:var(--or)} .vert{color:var(--vert)}
.prune{color:var(--prune)} .poudre{color:var(--poudre)}
.pill{border:1px solid var(--bord);padding:1px 5px;font-size:10px;
      color:var(--faible);white-space:nowrap}
.vign{display:inline-block;flex:none}

/* ---- blocs de dossier ---- */
.bloc{border:2px solid var(--bord);padding:8px;margin-bottom:8px}
.bloc.chaud{border-color:var(--prune)}
.detail{border-top:2px solid var(--bord);margin-top:8px;padding-top:8px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
@media(max-width:560px){.slots{grid-template-columns:repeat(2,1fr)}}
.slot{border:2px solid var(--bord);padding:7px;font-size:10px;background:#271f30;
      text-align:left;display:block;width:100%;cursor:pointer}
.slot u{display:block;text-decoration:none;color:var(--faible);font-size:9px;
        font-family:var(--pixel);letter-spacing:.05em;margin-bottom:3px}
.slot b{display:block;color:var(--creme);font-size:11px}
.slot[data-vide]{border-style:dashed}
.slot[data-vide] b{color:var(--faible)}
.slot[data-on]{border-color:var(--poudre)}
.choix{border:2px solid var(--poudre);padding:8px;margin-top:8px;
       max-height:340px;overflow-y:auto}
.carte-art{display:flex;align-items:center;gap:8px;padding:5px 0;
           border-bottom:1px solid #453a4e}
.carte-art .corps{flex:1;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.grille-cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
            gap:6px;margin:6px 0}
.carte{display:flex;flex-direction:column;align-items:flex-start;gap:2px;
       text-align:left;padding:7px;font-size:10px}

/* ---- bandeaux ---- */
.bandeau{background:var(--nuit2);border:2px solid var(--bord);
  border-left:6px solid var(--or);padding:8px 12px;
  font-size:11px;color:var(--creme);display:flex;align-items:center;
  gap:10px;flex-wrap:wrap}
.bandeau.urgent{border-left-color:var(--prune);background:var(--prune)}
.bandeau.alerte{border-left-color:var(--prune);background:#4a2438}
.bandeau.guide{border-left-color:var(--poudre)}

/* ---- resultat du jour J ---- */
.resultat{border-top:2px solid var(--bord)}
.score{font-family:var(--pixel);font-size:34px;color:var(--or);line-height:1}
.score.prune{color:var(--prune)}

/* ---- le SEUL modal du jeu : le salon ---- */
.modal{position:fixed;inset:0;background:rgba(26,20,32,.92);z-index:50;
       display:flex;align-items:flex-start;justify-content:center;
       padding:24px 12px;overflow-y:auto}
/* ⚠️ `display:flex` ecrase l'attribut `hidden`, qui ne vaut que `display:none`
   par defaut. Sans cette regle, le modal invisible reste etale sur tout
   l'ecran et AVALE TOUS LES CLICS — le jeu se lance et ne repond a rien.
   Meme piege pour le flash. */
.modal[hidden],.flash[hidden]{display:none}
.modal .boite{width:100%;max-width:640px;border:2px solid var(--or);
       background:var(--nuit);box-shadow:0 0 0 6px #1a1420}
.modal .panneau{border:0}

/* ---- flash ---- */
.flash{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  background:var(--nuit2);border:2px solid var(--poudre);color:var(--creme);
  padding:8px 16px;font-size:12px;z-index:60;max-width:90vw;text-align:center}

/* ---- ecran titre ---- */
.titre-ecran{border:2px solid var(--bord2);background:var(--nuit);
  box-shadow:0 0 0 4px #1a1420;padding:0 0 20px;text-align:center}
.titre-ecran canvas{display:block;width:100%;height:auto;image-rendering:pixelated;
  border-bottom:2px solid var(--bord)}
.titre-ecran h1{font-family:var(--pixel);font-size:26px;color:var(--creme);
  letter-spacing:.05em;margin:18px 0 6px}
.titre-ecran .sous{color:var(--faible);max-width:52ch;margin:0 auto 18px;
  padding:0 16px;font-size:12px}
.titre-ecran .menu{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
  padding:0 16px}
.titre-ecran .pied{color:var(--faible);font-size:10px;margin:20px 16px 0}
.titre-ecran .alerte-txt{color:var(--poudre);font-size:11px;margin:14px 16px 0}
#titre-zone{max-width:520px;margin:14px auto 0;padding:0 16px;text-align:left}
</style>
</head>
<body>
<div id="app"></div>
<noscript>
  <p>Ce jeu est entièrement dessiné à l'exécution : il lui faut JavaScript.</p>
</noscript>
<!-- ⚠️ Les modules sont en ESM : ouvrir ce fichier en file:// ne marche pas.
     Il faut passer par un serveur — `npm run dev`. -->
<script type="module" src="src/main.js"></script>
</body>
</html>
